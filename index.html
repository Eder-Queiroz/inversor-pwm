<!DOCTYPE html>
<html>
  <head>
    <title>Simulação PWM Senoidal x Triangular</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  </head>
  <body>
    <div>
      <label
        >Frequência da Senoide:
        <input type="range" id="freqSenoide" min="1" max="5000" value="2000" />
      </label>
      <span id="valSenoide">60</span> Hz
      <br />
      <label
        >Frequência da Triangular:
        <input
          type="range"
          id="freqTriangular"
          min="1"
          max="5000"
          value="5000"
        />
      </label>
      <span id="valTriangular">60</span> Hz
      <br />
      <label
        >Períodos a exibir:
        <input type="range" id="periodos" min="1" max="10" value="2" />
      </label>
      <span id="valPeriodos">2</span>
    </div>
    <div id="plot" style="width: 100%; height: 500px"></div>

    <script>
      const plotElement = document.getElementById("plot");
      const freqSenoideInput = document.getElementById("freqSenoide");
      const freqTriangularInput = document.getElementById("freqTriangular");
      const periodosInput = document.getElementById("periodos");
      const valSenoide = document.getElementById("valSenoide");
      const valTriangular = document.getElementById("valTriangular");
      const valPeriodos = document.getElementById("valPeriodos");

      function gerarDados(freqSenoide, freqTriangular, periodos) {
        const samples = 1000;
        const periodoSenoide = 1 / freqSenoide;
        const duracao = periodos * periodoSenoide; // quantidade ajustável de períodos
        const t = [],
          senoide = [],
          triangular = [],
          pwm = [];

        for (let i = 0; i < samples; i++) {
          let time = (i / (samples - 1)) * duracao;
          t.push(time);

          // Onda senoide
          let sen = Math.sin(2 * Math.PI * freqSenoide * time);

          // Onda triangular (normalizada de -1 a 1)
          let tri = 2 * Math.abs(2 * ((freqTriangular * time) % 1) - 1) - 1;

          senoide.push(sen);
          triangular.push(tri);

          // PWM: 1 se senoide > triangular, senão 0
          pwm.push(sen > tri ? 1 : 0);
        }

        return { t, senoide, triangular, pwm };
      }

      function desenhar() {
        const freqS = parseFloat(freqSenoideInput.value);
        const freqT = parseFloat(freqTriangularInput.value);
        const periodos = parseInt(periodosInput.value);

        valSenoide.textContent = freqS;
        valTriangular.textContent = freqT;
        valPeriodos.textContent = periodos;

        const { t, senoide, triangular, pwm } = gerarDados(
          freqS,
          freqT,
          periodos
        );

        const data = [
          { x: t, y: senoide, name: "Senoide", type: "scatter" },
          { x: t, y: triangular, name: "Triangular", type: "scatter" },
          { x: t, y: pwm, name: "PWM", type: "scatter", line: { shape: "hv" } },
        ];

        Plotly.newPlot(plotElement, data, {
          title: "PWM Senoidal x Onda Triangular",
          xaxis: { title: "Tempo (s)" },
          yaxis: { title: "Amplitude", range: [-1.2, 1.2] },
        });
      }

      freqSenoideInput.addEventListener("input", desenhar);
      freqTriangularInput.addEventListener("input", desenhar);
      periodosInput.addEventListener("input", desenhar);

      desenhar();
    </script>
  </body>
</html>
