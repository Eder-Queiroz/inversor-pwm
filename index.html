<!DOCTYPE html>
<html>
  <head>
    <title>Simulação PWM Senoidal x Triangular</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
  </head>
  <body>
    <div>
      <label
        >Frequência da Senoide:
        <input type="range" id="freqSenoide" min="1" max="5000" value="2000" />
      </label>
      <span id="valSenoide">60</span> Hz
      <br />
      <label
        >Frequência da Triangular:
        <input
          type="range"
          id="freqTriangular"
          min="1"
          max="5000"
          value="5000"
        />
      </label>
      <span id="valTriangular">60</span> Hz
      <br />
      <label
        >Períodos a exibir:
        <input type="range" id="periodos" min="1" max="10" value="2" />
      </label>
      <span id="valPeriodos">2</span>
    </div>
    <div id="plot" style="width: 100%; height: 500px"></div>

    <script src="./javascript.js"></script>
  </body>
</html>
